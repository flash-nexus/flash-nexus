minimumReleaseAgeExcludePrune: true
minimumReleaseAgeExclude:
  - '@flash-tunnel/adapter-cloudflare'
  - '@flash-tunnel/config'
  - '@flash-tunnel/core'
  - '@flash-tunnel/types'
  - '@flash-tunnel/utils'
  - '@flash-dns/adapter-cloudflare'
  - '@flash-dns/config'
  - '@flash-dns/core'
  - '@flash-dns/types'

trustPolicy: no-downgrade
shellEmulator: true

packages:
  - packages/*

allowBuilds:
  esbuild: true
